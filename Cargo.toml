[workspace]
resolver = "2"
members = [
    "crates/merlion-core",
    "crates/merlion-llm",
    "crates/merlion-tools",
    "crates/merlion-config",
    "crates/merlion-session",
    "crates/merlion-memory",
    "crates/merlion-skills",
    "crates/merlion-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/MerlionOS/merlion-agent"
authors = ["MerlionOS contributors"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.45", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
dotenvy = "0.15"
rustyline = "14.0"
shell-escape = "0.1"

merlion-core = { path = "crates/merlion-core" }
merlion-llm = { path = "crates/merlion-llm" }
merlion-tools = { path = "crates/merlion-tools" }
merlion-config = { path = "crates/merlion-config" }
merlion-session = { path = "crates/merlion-session" }
merlion-memory = { path = "crates/merlion-memory" }
merlion-skills = { path = "crates/merlion-skills" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
