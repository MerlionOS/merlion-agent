[workspace]
resolver = "2"
members = [
    "crates/merlion-core",
    "crates/merlion-llm",
    "crates/merlion-tools",
    "crates/merlion-config",
    "crates/merlion-session",
    "crates/merlion-memory",
    "crates/merlion-skills",
    "crates/merlion-mcp",
    "crates/merlion-gateway",
    "crates/merlion-cron",
    # The CLI binary crate lives under crates/merlion-cli/ but is published
    # as `merlion-agent` (its [package].name) for naming symmetry with the
    # repo and `pip install hermes-agent`'s convention.
    "crates/merlion-cli",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/MerlionOS/merlion-agent"
authors = ["MerlionOS contributors"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.45", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
dotenvy = "0.15"
rustyline = "14.0"
shell-escape = "0.1"

# path + version: cargo uses `path` for local dev, `version` is what gets
# written into the published crate metadata so dependents pull from crates.io.
merlion-core = { path = "crates/merlion-core", version = "0.1.2" }
merlion-llm = { path = "crates/merlion-llm", version = "0.1.2" }
merlion-tools = { path = "crates/merlion-tools", version = "0.1.2" }
merlion-config = { path = "crates/merlion-config", version = "0.1.2" }
merlion-session = { path = "crates/merlion-session", version = "0.1.2" }
merlion-memory = { path = "crates/merlion-memory", version = "0.1.2" }
merlion-skills = { path = "crates/merlion-skills", version = "0.1.2" }
merlion-mcp = { path = "crates/merlion-mcp", version = "0.1.2" }
merlion-gateway = { path = "crates/merlion-gateway", version = "0.1.2" }
merlion-cron = { path = "crates/merlion-cron", version = "0.1.2" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
