[package]
name = "merlion-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Merlion Agent CLI"
default-run = "merlion"

[[bin]]
name = "merlion"
path = "src/main.rs"

# `cargo binstall merlion` will look here for prebuilt binaries once the
# release workflow (Phase 8.2) starts publishing them.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/merlion-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "merlion-{ target }/{ bin }{ binary-ext }"

[dependencies]
merlion-core.workspace = true
merlion-llm.workspace = true
merlion-tools.workspace = true
merlion-config.workspace = true
merlion-session.workspace = true
merlion-memory.workspace = true
merlion-skills.workspace = true
merlion-mcp.workspace = true
merlion-gateway.workspace = true
merlion-cron.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["full"] }
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustyline.workspace = true
uuid.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_yaml.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json"] }
dirs.workspace = true
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
