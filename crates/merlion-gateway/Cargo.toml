[package]
name = "merlion-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Messaging gateway for Merlion Agent (Telegram, Discord, Slack)"

[dependencies]
merlion-core.workspace = true
merlion-session.workspace = true
merlion-config.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
dirs.workspace = true
tokio = { workspace = true, features = ["full"] }
async-trait.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["json", "stream", "multipart"] }
futures.workspace = true
uuid.workspace = true
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
